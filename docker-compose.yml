services:
  postgres:
    image: postgres:16-alpine
    container_name: code-quest-postgres
    environment:
      POSTGRES_DB: code_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d code_quest']
      interval: 3s
      timeout: 5s
      retries: 20
